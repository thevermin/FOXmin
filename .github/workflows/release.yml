name: Publicar versión
# Arma la versión en GitHub como borrador, con las notas de docs/releases/<etiqueta>.md.
# Antes comprueba que la app compile en una Mac de GitHub, pero NO adjunta esa compilación:
# el zip se arma en la Mac de thevermin con «./build.sh --zip» (firmado con el certificado fijo)
# y se sube a mano al borrador antes de publicarlo.
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'Etiqueta (por ejemplo v0.1.0)', required: true }

jobs:
  release:
    runs-on: macos-latest
    permissions: { contents: write }
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que la etiqueta coincida con la versión de la app
        run: |
          set -e
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          tag="${{ inputs.tag }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::La etiqueta $tag no coincide con la versión de Info.plist ($version)"
            exit 1
          fi
          test -f "docs/releases/$tag.md" || { echo "::error::Faltan las notas: docs/releases/$tag.md"; exit 1; }

      - name: Comprobar que compila
        run: ./build.sh

      - name: Crear el borrador
        run: |
          set -e
          tag="${{ inputs.tag }}"
          notes="docs/releases/$tag.md"
          title=$(head -1 "$notes" | sed 's/^## *//')
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$title" --notes-file "$notes" --draft
